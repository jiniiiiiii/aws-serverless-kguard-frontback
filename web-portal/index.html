<script>
    const API_URL = "https://hwuhh3d5d45nbsyu7beqld7twi0dfpsk.lambda-url.ap-northeast-2.on.aws/";

    function toggleChat() {
        const box = document.getElementById('chat-box');
        if (box.style.display === 'none' || box.style.display === '') {
            box.style.display = 'flex';
        } else {
            box.style.display = 'none';
        }
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const logs = document.getElementById('chat-logs');
        const msg = input.value;
        if (!msg.trim()) return;

        logs.innerHTML += `<div style="text-align: right; margin: 8px 0; color: #aaa;">> ${msg}</div>`;
        input.value = '';
        logs.scrollTop = logs.scrollHeight;

        const loadingId = "loading-" + Date.now();
        logs.innerHTML += `
          <div id="${loadingId}" style="margin: 8px 0; display: flex; align-items: center;">
              <div style="border: 1px solid #00ff00; border-radius: 20px; padding: 6px 15px; color: #00ff00; font-size: 13px; animation: blink 1s infinite; background: rgba(0, 255, 0, 0.1);">
                  📡 통신 중...
              </div>
          </div>`;
        logs.scrollTop = logs.scrollHeight;

        // 1. 로그인된 아이디 가져오기
        const realUser = localStorage.getItem('kguard_user_id');
        
        // 2. [핵심] 로그인할 때 발급받은 '대화방 번호' 가져오기
        // (만약 로그아웃 상태라 없으면 임시로 'guest-랜덤'을 씁니다)
        const chatSessionId = localStorage.getItem('kguard_session_key') || "guest-" + Date.now();

        if (!realUser) {
            setTimeout(() => {
                document.getElementById(loadingId).remove();
                logs.innerHTML += `
                  <div style="color: #ff3333; margin: 10px 0; text-shadow: 0 0 5px rgba(255,0,0,0.5);">
                      ⚠️ <strong>[경고] 접근 거부</strong><br>
                      정보가 없습니다. 어서 지키러 와주세요.
                  </div>`;
                logs.scrollTop = logs.scrollHeight;
            }, 600);
            return;
        }

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: msg, 
                    user_id: realUser,        // 내 아이디 (점수 조회용)
                    session_id: chatSessionId // 대화방 번호 (로그아웃 전까지 유지됨)
                })
            });
            
            const data = await res.json();
            document.getElementById(loadingId).remove();
            
            const formattedReply = data.reply.replace(/\n/g, '<br>');
            logs.innerHTML += `<div style="color: #00ff00; margin: 10px 0; text-shadow: 0 0 5px rgba(0,255,0,0.3);">${formattedReply}</div>`;

        } catch (e) {
            document.getElementById(loadingId).remove();
            console.error(e);
            logs.innerHTML += `<div style="color: red; margin: 5px 0;">[시스템 오류] 통신 실패.</div>`;
        }
        logs.scrollTop = logs.scrollHeight;
    }

    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #004400; border-radius: 4px; }
    `;
    document.head.appendChild(style);
</script>
