<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>k-가드</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <div id="chat-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
        <button onclick="toggleChat()" style="
        position: relative;
        width: 70px;
        height: 70px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
            <img src="/chat-icon.PNG" alt="Chat" style="
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.8));
            transition: transform 0.2s;
        " onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1.0)'">
        </button>

        <div id="chat-box"
            style="display: none; position: absolute; bottom: 80px; right: 0; width: 350px; height: 500px; background: rgba(0, 10, 30, 0.95); border: 2px solid #00ccff; border-radius: 15px; flex-direction: column; box-shadow: 0 0 30px rgba(0, 200, 255, 0.3); overflow: hidden;">

            <div
                style="padding: 15px; border-bottom: 1px solid #00ccff; background: #001122; color: #00ccff; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                <span style="text-shadow: 0 0 5px #00ccff;">🔵 K-Guard 가이드</span>
                <span style="cursor: pointer; font-size: 20px;" onclick="toggleChat()">×</span>
            </div>

            <div id="chat-logs"
                style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
                <div
                    style="align-self: center; background: rgba(0, 204, 255, 0.1); color: #00ccff; padding: 10px 15px; border-radius: 10px; border: 1px dashed #005588; text-align: center; font-size: 13px; margin-bottom: 10px; width: 90%;">
                    환영합니다 용사님!<br>무엇을 도와드릴까요? 🛡️
                </div>
            </div>

            <div style="padding: 10px; border-top: 1px solid #00ccff; display: flex; background: #000810;">
                <input id="chat-input" type="text" placeholder="명령어 입력..."
                    style="flex: 1; background: #111; color: #fff; border: 1px solid #333; padding: 10px; outline: none; border-radius: 5px;"
                    onkeypress="if(event.keyCode==13) sendMessage()">
                <button onclick="sendMessage()"
                    style="margin-left: 8px; background: #003366; color: #00ccff; border: 1px solid #00ccff; cursor: pointer; padding: 0 15px; font-weight: bold; border-radius: 5px; transition: 0.2s;">전송</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://sbfu5vljtlmkzdunw6e6cyr4bi0qbacc.lambda-url.ap-northeast-2.on.aws/";

        function toggleChat() {
            const box = document.getElementById('chat-box');
            if (box.style.display === 'none' || box.style.display === '') {
                box.style.display = 'flex';
            } else {
                box.style.display = 'none';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const logs = document.getElementById('chat-logs');
            const msg = input.value;
            if (!msg.trim()) return;

            // 사용자 말풍선
            logs.innerHTML += `
            <div class="msg-row user">
                <div class="msg-bubble user-bubble">
                    ${msg}
                </div>
            </div>`;

            input.value = '';
            logs.scrollTop = logs.scrollHeight;

            const loadingId = "loading-" + Date.now();

            // 로딩 말풍선
            logs.innerHTML += `
            <div id="${loadingId}" class="msg-row bot">
                <div class="msg-bubble bot-bubble" style="animation: blink 1.5s infinite; color: #aaa;">
                    👀 데이터 분석 중...
                </div>
            </div>`;
            logs.scrollTop = logs.scrollHeight;

            const storedUser = localStorage.getItem('kguard_user_id');
            const realToken = localStorage.getItem('auth_token');
            const sessionKey = localStorage.getItem('kguard_session_key') || "guest-" + Date.now();

            let finalUserId;
            if (storedUser && realToken) {
                finalUserId = storedUser;
            } else {
                finalUserId = "guest-survivor";
            }

            if (finalUserId === "guest-survivor") {
                const forbiddenWords = ['내 랭킹', '내 순위', '내 점수', '제 점수', '몇등', '몇 등', '내 등수', '내 기록'];

                if (forbiddenWords.some(word => msg.includes(word))) {
                    setTimeout(() => {
                        document.getElementById(loadingId).remove();
                        logs.innerHTML += `
                        <div class="msg-row bot">
                            <div class="msg-bubble warning-bubble">
                                ⚠️ <strong>[접근 거부]</strong><br>
                                내 정보는 로그인 시에만 확인할 수 있습니다.
                            </div>
                        </div>`;
                        logs.scrollTop = logs.scrollHeight;
                    }, 600);
                    return;
                }
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        user_id: finalUserId,
                        session_id: sessionKey
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();

                const formattedReply = data.reply.replace(/\n/g, '<br>');

                // AI 답변 말풍선
                logs.innerHTML += `
                <div class="msg-row bot">
                    <div class="msg-bubble bot-bubble">
                        ${formattedReply}
                    </div>
                </div>`;

            } catch (e) {
                document.getElementById(loadingId).remove();
                console.error(e);
                logs.innerHTML += `<div style="text-align:center; color: red; margin: 10px 0; font-size:12px;">[시스템 오류] 통신 실패</div>`;
            }
            logs.scrollTop = logs.scrollHeight;
        }

        // ▼▼▼ CSS 스타일 (폰트 설정 포함) ▼▼▼
        const style = document.createElement('style');
        style.innerHTML = `
          /* 1. 폰트 등록 (넷마블체) */
          @font-face {
              font-family: 'Netmarble';
              src: url('/fonts/netmarble_Bold.ttf') format('truetype');
              font-weight: normal;
              font-style: normal;
          }

          /* 2. 챗봇 위젯 안쪽 요소들에만 폰트 적용 */
          #chat-widget, 
          #chat-widget button, 
          #chat-widget input, 
          #chat-widget .msg-bubble {
              font-family: 'Netmarble', sans-serif !important;
          }

          /* 메시지 행 스타일 */
          .msg-row {
              display: flex;
              width: 100%;
              margin-bottom: 5px;
              opacity: 0;
              animation: popIn 0.3s forwards;
          }
          
          @keyframes popIn {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
          }

          .msg-row.user { justify-content: flex-end; }
          .msg-row.bot { justify-content: flex-start; }

          .msg-bubble {
              max-width: 80%;
              padding: 10px 14px;
              border-radius: 15px;
              font-size: 14px;
              line-height: 1.5;
              word-wrap: break-word;
              position: relative;
              box-shadow: 0 2px 5px rgba(0,0,0,0.5);
          }

          /* 사용자: 초록 배경 + 흰색 글씨 */
          .user-bubble {
              background: #006600;
              color: #ffffff;
              border: 1px solid #00ff00;
              border-bottom-right-radius: 2px;
          }

          /* AI: 파란 배경 + 흰색 글씨 */
          .bot-bubble {
              background: #003366;
              color: #ffffff;
              border: 1px solid #00ccff;
              border-bottom-left-radius: 2px;
          }

          .warning-bubble {
              background: #660000;
              color: #ffffff;
              border: 1px solid #ff3333;
              border-bottom-left-radius: 2px;
          }

          @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
          
          ::-webkit-scrollbar { width: 6px; }
          ::-webkit-scrollbar-track { background: #000; }
          ::-webkit-scrollbar-thumb { background: #003366; border-radius: 10px; }
      `;
        document.head.appendChild(style);
    </script>
</body>

</html>
