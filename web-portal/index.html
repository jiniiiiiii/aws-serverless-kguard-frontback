<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>k-가드</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <div id="chat-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; font-family: 'Courier New', monospace;">
      
      <button onclick="toggleChat()" style="width: 60px; height: 60px; border-radius: 50%; background: #000; border: 2px solid #00ff00; color: #00ff00; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); transition: transform 0.2s;">CHAT</button>
      
      <div id="chat-box" style="display: none; position: absolute; bottom: 80px; right: 0; width: 350px; height: 500px; background: rgba(0, 0, 0, 0.95); border: 2px solid #00ff00; border-radius: 10px; flex-direction: column; box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);">
          
          <div style="padding: 15px; border-bottom: 1px solid #00ff00; background: #051a05; color: #00ff00; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
              <span>🟢 TACTICAL ARCHIVIST</span>
              <span style="cursor: pointer; font-size: 20px;" onclick="toggleChat()">×</span>
          </div>

          <div id="chat-logs" style="flex: 1; padding: 15px; overflow-y: auto; color: #e0e0e0; font-size: 14px; line-height: 1.5;">
              <div style="color: #00ff00; margin-bottom: 15px; border-bottom: 1px dashed #004400; padding-bottom: 10px;">
                  [SYSTEM] 전술 기록관 연결 성공.<br>
                  생존자, 신원을 밝혀라.<br>
                  (예: <strong>dudgns901 정보</strong>)
              </div>
          </div>

          <div style="padding: 10px; border-top: 1px solid #00ff00; display: flex; background: #000;">
              <input id="chat-input" type="text" placeholder="명령어 입력..." style="flex: 1; background: #111; color: #fff; border: 1px solid #333; padding: 10px; outline: none; border-radius: 4px;" onkeypress="if(event.keyCode==13) sendMessage()">
              <button onclick="sendMessage()" style="margin-left: 8px; background: #004400; color: #00ff00; border: 1px solid #00ff00; cursor: pointer; padding: 0 15px; font-weight: bold; border-radius: 4px;">SEND</button>
          </div>
      </div>
  </div>

  <script>
      // ★ 사용자님의 Lambda 주소 적용 완료
      const API_URL = "https://hwuhh3d5d45nbsyu7beqld7twi0dfpsk.lambda-url.ap-northeast-2.on.aws/";

      function toggleChat() {
          const box = document.getElementById('chat-box');
          // 열림/닫힘 토글
          if (box.style.display === 'none' || box.style.display === '') {
              box.style.display = 'flex';
          } else {
              box.style.display = 'none';
          }
      }

      async function sendMessage() {
          const input = document.getElementById('chat-input');
          const logs = document.getElementById('chat-logs');
          const msg = input.value;
          if (!msg.trim()) return;

          // 1. 내 메시지 표시
          logs.innerHTML += `<div style="text-align: right; margin: 8px 0; color: #aaa;">> ${msg}</div>`;
          input.value = '';
          logs.scrollTop = logs.scrollHeight;

          // 2. 로딩 표시 (깜빡임 애니메이션)
          const loadingId = "loading-" + Date.now();
          logs.innerHTML += `<div id="${loadingId}" style="color: #00ff00; margin: 8px 0; animation: blink 1s infinite;">[데이터 분석 중...]</div>`;
          logs.scrollTop = logs.scrollHeight;

          try {
              // 3. 람다 서버로 전송
              const res = await fetch(API_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ 
                      message: msg, 
                      user_id: "dudgns901" // 실제 서비스에선 로그인된 유저 ID 사용
                  })
              });
              
              const data = await res.json();
              
              // 4. 로딩 제거 및 답변 표시
              document.getElementById(loadingId).remove();
              
              // 줄바꿈 문자(\n)를 HTML 태그(<br>)로 변환
              const formattedReply = data.reply.replace(/\n/g, '<br>');
              logs.innerHTML += `<div style="color: #00ff00; margin: 10px 0; text-shadow: 0 0 5px rgba(0,255,0,0.3);">${formattedReply}</div>`;

          } catch (e) {
              document.getElementById(loadingId).remove();
              console.error(e);
              logs.innerHTML += `<div style="color: red; margin: 5px 0;">[SYSTEM ERROR] 통신 실패.</div>`;
          }
          logs.scrollTop = logs.scrollHeight;
      }

      // 깜빡임 애니메이션 스타일 추가
      const style = document.createElement('style');
      style.innerHTML = `
          @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
          /* 스크롤바 디자인 */
          ::-webkit-scrollbar { width: 8px; }
          ::-webkit-scrollbar-track { background: #000; }
          ::-webkit-scrollbar-thumb { background: #004400; border-radius: 4px; }
          ::-webkit-scrollbar-thumb:hover { background: #00ff00; }
      `;
      document.head.appendChild(style);
  </script>
  </body>
</html>
