<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>k-가드</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <div id="chat-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
        <button onclick="openSystemChat()" style="
        position: relative;
        width: 70px;
        height: 70px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
            <img src="/chat-icon.PNG" alt="Chat" style="
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.8));
            transition: transform 0.2s;
        " onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1.0)'">
        </button>

        <div id="chat-box"
            style="display: none; position: absolute; bottom: 80px; right: 0; width: 350px; height: 500px; background: rgba(0, 10, 30, 0.95); border: 2px solid #00ccff; border-radius: 15px; flex-direction: column; box-shadow: 0 0 30px rgba(0, 200, 255, 0.3); overflow: hidden;">

            <div
                style="padding: 15px; border-bottom: 1px solid #00ccff; background: #001122; color: #00ccff; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                <span id="chat-title" style="text-shadow: 0 0 5px #00ccff;">🔵 K-Guard 가이드</span>
                <span style="cursor: pointer; font-size: 20px;" onclick="closeChat()">×</span>
            </div>

            <div id="chat-logs"
                style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
                </div>

            <div style="padding: 10px; border-top: 1px solid #00ccff; display: flex; background: #000810;">
                <input id="chat-input" type="text" placeholder="메시지를 입력하세요..."
                    style="flex: 1; background: #111; color: #fff; border: 1px solid #333; padding: 10px; outline: none; border-radius: 5px;"
                    onkeypress="if(event.keyCode==13) sendMessage()">
                <button onclick="sendMessage()"
                    style="margin-left: 8px; background: #003366; color: #00ccff; border: 1px solid #00ccff; cursor: pointer; padding: 0 15px; font-weight: bold; border-radius: 5px; transition: 0.2s;">전송</button>
            </div>
        </div>
    </div>

    <script>
        // ▼▼▼ [설정] 두 개의 람다 주소를 입력했습니다 ▼▼▼
        
        // 1. 시스템 봇 (공지사항, 랭킹 등)
        const SYSTEM_API_URL = "https://sbfu5vljtlmkzdunw6e6cyr4bi0qbacc.lambda-url.ap-northeast-2.on.aws/";

        // 2. 캐릭터 봇 (페르소나 대화)
        const CHARACTER_API_URL = "https://wtra2zvnbxxms4vry7zjtchzeu0ztlup.lambda-url.ap-northeast-2.on.aws/";


        // 현재 대화 상대 (기본값: System)
        let currentChatTarget = "System"; 

        // [기능 1] 우측 하단 기본 챗봇 버튼 클릭 시
        function openSystemChat() {
            const box = document.getElementById('chat-box');
            
            // 이미 열려있고 대상이 System이면 닫기 (토글 기능)
            if (box.style.display === 'flex' && currentChatTarget === 'System') {
                closeChat();
                return;
            }

            // 시스템 모드로 변경
            currentChatTarget = "System";
            document.getElementById('chat-title').innerText = "🔵 K-Guard 가이드";
            
            const logs = document.getElementById('chat-logs');
            logs.innerHTML = `
                <div style="align-self: center; background: rgba(0, 204, 255, 0.1); color: #00ccff; padding: 10px 15px; border-radius: 10px; border: 1px dashed #005588; text-align: center; font-size: 13px; margin-bottom: 10px; width: 90%;">
                    환영합니다 용사님!<br>시스템 가이드봇입니다. 무엇을 도와드릴까요? 🛡️
                </div>`;
            
            box.style.display = 'flex';
        }

        // [기능 2] 캐릭터 아이콘 클릭 시 (리액트에서 호출됨)
        window.openCharacterChat = function(charName) {
            currentChatTarget = charName; // "영훈", "유진" 등
            
            const box = document.getElementById('chat-box');
            document.getElementById('chat-title').innerText = "💬 " + charName + "님과의 대화";

            const logs = document.getElementById('chat-logs');
            logs.innerHTML = `
                <div style="align-self: center; background: rgba(255, 200, 0, 0.1); color: #ffcc00; padding: 10px 15px; border-radius: 10px; border: 1px dashed #aa8800; text-align: center; font-size: 13px; margin-bottom: 10px; width: 90%;">
                    <strong>${charName}</strong>님과 연결되었습니다.<br>대화를 시작해보세요!
                </div>`;

            box.style.display = 'flex';
        }

        // 채팅창 닫기
        function closeChat() {
            document.getElementById('chat-box').style.display = 'none';
        }

        // [기능 3] 메시지 전송 (핵심 로직)
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const logs = document.getElementById('chat-logs');
            const msg = input.value;
            if (!msg.trim()) return;

            // 사용자 말풍선 표시
            logs.innerHTML += `
            <div class="msg-row user">
                <div class="msg-bubble user-bubble">${msg}</div>
            </div>`;

            input.value = '';
            logs.scrollTop = logs.scrollHeight;

            const loadingId = "loading-" + Date.now();
            const thinkingName = currentChatTarget === 'System' ? '가이드봇' : currentChatTarget;
            
            // 로딩 표시
            logs.innerHTML += `
            <div id="${loadingId}" class="msg-row bot">
                <div class="msg-bubble bot-bubble" style="color:#aaa;">👀 ${thinkingName}님이 생각 중...</div>
            </div>`;
            logs.scrollTop = logs.scrollHeight;

            const storedUser = localStorage.getItem('kguard_user_id');
            const sessionKey = localStorage.getItem('kguard_session_key') || "guest-" + Date.now();
            let finalUserId = storedUser ? storedUser : "guest-survivor";

            // ★★★ [중요] 대화 상대에 따라 보낼 주소를 선택합니다 ★★★
            let targetUrl = "";
            if (currentChatTarget === "System") {
                targetUrl = SYSTEM_API_URL;     // 공지사항/랭킹 람다로 전송
            } else {
                targetUrl = CHARACTER_API_URL;  // 캐릭터 대화 람다로 전송
            }

            try {
                const res = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        user_id: finalUserId,
                        session_id: sessionKey,
                        character: currentChatTarget // 캐릭터 이름 ("영훈" 등)
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();
                
                const formattedReply = data.reply.replace(/\n/g, '<br>');

                // AI 답변 표시
                logs.innerHTML += `
                <div class="msg-row bot">
                    <div class="msg-bubble bot-bubble">${formattedReply}</div>
                </div>`;

            } catch (e) {
                document.getElementById(loadingId).remove();
                console.error(e);
                logs.innerHTML += `<div style="text-align:center; color: red; margin: 10px 0; font-size:12px;">[오류] 서버 응답 없음</div>`;
            }
            logs.scrollTop = logs.scrollHeight;
        }

        // 스타일 (CSS)
        const style = document.createElement('style');
        style.innerHTML = `
          @font-face { font-family: 'Netmarble'; src: url('/fonts/netmarble_Bold.ttf') format('truetype'); }
          #chat-widget, #chat-widget button, #chat-widget input, #chat-widget .msg-bubble { font-family: 'Netmarble', sans-serif !important; }
          .msg-row { display: flex; width: 100%; margin-bottom: 5px; opacity: 0; animation: popIn 0.3s forwards; }
          @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          .msg-row.user { justify-content: flex-end; }
          .msg-row.bot { justify-content: flex-start; }
          .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.5; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
          .user-bubble { background: #006600; color: #fff; border: 1px solid #00ff00; border-bottom-right-radius: 2px; }
          .bot-bubble { background: #003366; color: #fff; border: 1px solid #00ccff; border-bottom-left-radius: 2px; }
          ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: #003366; border-radius: 10px; }
      `;
        document.head.appendChild(style);
    </script>
</body>

</html>
