<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Space Shooter - Balanced Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: monospace;
        }
        canvas {
            border: 4px solid #84cc16;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(132, 204, 22, 0.6);
            background-color: #020617; 
        }
        .ui-text {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #84cc16;
            text-shadow: 0 0 10px rgba(132, 204, 22, 0.5);
        }
        .desc-text {
            margin-top: 1rem;
            color: #9ca3af;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="scoreBoard" class="ui-text">PRESS SPACE TO START</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="descBoard" class="desc-text">난이도 완화됨 | 50점마다 속도 증가</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreBoard');
        const descEl = document.getElementById('descBoard');

        let gameState = 'ready'; 
        let score = 0;
        let animationId = null;

        const BULLET_RADIUS = 2.5;

        const game = {
            player: { 
                x: 185, y: 185, 
                width: 30, height: 30, 
                vx: 0, vy: 0,            
                accel: 0.8,    // 플레이어 성능은 좋게 유지 (피하기 쉬움)
                friction: 0.85,         
                maxSpeed: 4.5  
            },
            bullets: [],
            keys: {},
            lastBulletSpawn: 0
        };

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                game.keys[e.key] = true;
            }
            if (e.key === ' ' && gameState !== 'playing') {
                startGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            game.keys[e.key] = false;
        });

        function startGame() {
            game.player = { 
                x: 185, y: 185, 
                width: 30, height: 30, 
                vx: 0, vy: 0,
                accel: 0.8,
                friction: 0.85,
                maxSpeed: 4.5
            };
            game.bullets = [];
            game.lastBulletSpawn = 0;
            score = 0;
            gameState = 'playing';
            descEl.innerText = '오래버티면 선물이 있을지도?🎁';
            gameLoop(0);
        }

        function drawPlayer() {
            const p = game.player;
            const x = p.x;
            const y = p.y;
            const s = 2; 

            // 몬스터 그리기
            ctx.fillStyle = '#ef4444'; 
            ctx.fillRect(x + 6*s, y, 4*s, 2*s);
            ctx.fillRect(x + 11*s, y + 2*s, 2*s, 4*s);

            ctx.fillStyle = '#a3e635'; 
            ctx.fillRect(x + 2*s, y + 2*s, 10*s, 11*s); 

            ctx.fillStyle = '#facc15'; 
            ctx.fillRect(x, y + 2*s, 2*s, 3*s); 
            ctx.fillRect(x + 10*s, y + 2*s, 2*s, 3*s); 

            ctx.fillStyle = '#dc2626'; 
            ctx.fillRect(x + 3*s, y + 5*s, 3*s, 2*s); 
            ctx.fillRect(x + 8*s, y + 5*s, 3*s, 2*s); 
            
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(x + 5*s, y + 5*s, 1*s, 1*s);
            ctx.fillRect(x + 10*s, y + 5*s, 1*s, 1*s);

            ctx.fillStyle = '#7f1d1d'; 
            ctx.fillRect(x + 3*s, y + 9*s, 8*s, 3*s);
            
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(x + 4*s, y + 9*s, 1*s, 1*s); 
            ctx.fillRect(x + 9*s, y + 9*s, 1*s, 1*s); 
            ctx.fillRect(x + 6*s, y + 11*s, 2*s, 1*s); 

            ctx.fillStyle = '#4d7c0f'; 
            ctx.fillRect(x + 3*s, y + 13*s, 2*s, 2*s);
            ctx.fillRect(x + 9*s, y + 13*s, 2*s, 2*s);
        }

        function spawnBullets(timestamp) {
            // [난이도 완화 1] 난이도 상승 속도 늦춤 (6000 -> 7000)
            const difficulty = Math.min(score / 7000, 1); 
            
            // [난이도 완화 2] 발사 간격 늘림 (360 -> 420) : 좀 더 띄엄띄엄 나옴
            const spawnInterval = 420 - (difficulty * 260); 
            
            // [난이도 유지 3] 한 번에 나오는 총알 수: 2개 유지 (재미 요소)
            const bulletsPerSpawn = 2 + Math.floor(difficulty * 3);

            if (timestamp - game.lastBulletSpawn > spawnInterval) {
                const pCenterX = game.player.x + game.player.width / 2;
                const pCenterY = game.player.y + game.player.height / 2;

                const currentDisplayScore = Math.floor(score / 10);
                
                // [난이도 완화 4] 레벨업 주기: 50점 (천천히 빨라짐)
                const speedLevel = Math.floor(currentDisplayScore / 50); 
                const speedBonus = speedLevel * 0.35; 

                for (let i = 0; i < bulletsPerSpawn; i++) {
                    const side = Math.floor(Math.random() * 4);
                    let startX, startY;
                    
                    switch(side) {
                        case 0: startX = Math.random() * 400; startY = -10; break; 
                        case 1: startX = Math.random() * 400; startY = 410; break; 
                        case 2: startX = -10; startY = Math.random() * 400; break; 
                        case 3: startX = 410; startY = Math.random() * 400; break; 
                    }

                    const dx = pCenterX - startX;
                    const dy = pCenterY - startY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // [난이도 완화 5] 총알 속도 감소: 1.8 -> 1.6
                    const baseSpeed = 1.6;
                    const randomVar = Math.random() * 1.6; 
                    
                    const bulletSpeed = (baseSpeed + speedBonus) + randomVar; 

                    game.bullets.push({
                        x: startX,
                        y: startY,
                        vx: (dx / distance) * bulletSpeed,
                        vy: (dy / distance) * bulletSpeed,
                        color: '#ffff00'
                    });
                }
                game.lastBulletSpawn = timestamp;
            }
        }

        function updateGame(timestamp) {
            const p = game.player;
            
            if (game.keys['ArrowLeft'])  p.vx -= p.accel;
            if (game.keys['ArrowRight']) p.vx += p.accel;
            if (game.keys['ArrowUp'])    p.vy -= p.accel;
            if (game.keys['ArrowDown'])  p.vy += p.accel;

            p.vx *= p.friction;
            p.vy *= p.friction;

            p.x += p.vx;
            p.y += p.vy;

            // 속도 제한
            const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
            if (speed > p.maxSpeed) {
                p.vx = (p.vx / speed) * p.maxSpeed;
                p.vy = (p.vy / speed) * p.maxSpeed;
            }

            if (p.x < 0) { p.x = 0; p.vx = 0; }
            if (p.x > 400 - p.width) { p.x = 400 - p.width; p.vx = 0; }
            if (p.y < 0) { p.y = 0; p.vy = 0; }
            if (p.y > 400 - p.height) { p.y = 400 - p.height; p.vy = 0; }

            spawnBullets(timestamp);

            game.bullets = game.bullets.filter(bullet => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;

                const hitBoxMargin = 4; 
                if (
                    bullet.x > p.x + hitBoxMargin &&
                    bullet.x < p.x + p.width - hitBoxMargin &&
                    bullet.y > p.y + hitBoxMargin &&
                    bullet.y < p.y + p.height - hitBoxMargin
                ) {
                    gameState = 'gameOver';
                    return false;
                }
                return bullet.x > -50 && bullet.x < 450 && bullet.y > -50 && bullet.y < 450;
            });

            score++;
            scoreEl.innerText = `SCORE: ${Math.floor(score / 10)}`;
        }

        function gameLoop(timestamp) {
            ctx.fillStyle = '#020617'; 
            ctx.fillRect(0, 0, 400, 400);

            if (gameState === 'playing') {
                updateGame(timestamp);
                drawPlayer();
                
                game.bullets.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                animationId = requestAnimationFrame(gameLoop);
            
            } else if (gameState === 'ready') {
                drawPlayer();
                ctx.fillStyle = '#84cc16';
                ctx.font = '20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('⭐K-GUARD EVENT GAME⭐', 200, 150);
                
            } else if (gameState === 'gameOver') {
                drawPlayer();
                game.bullets.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, 400, 400);
                
                ctx.fillStyle = '#ef4444';
                ctx.font = '30px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', 200, 180);
                
                const finalScore = Math.floor(score / 10);
                ctx.fillStyle = '#fff';
                ctx.font = '16px monospace';
                ctx.fillText(`최종 점수: ${finalScore}`, 200, 220);

                if (finalScore >= 265) {
                    ctx.fillStyle = '#facc15'; 
                    ctx.font = 'bold 20px monospace';
                    ctx.fillText('🎉 상품 획득 성공! 🎉', 200, 260);
                } else {
                    ctx.fillStyle = '#9ca3af';
                    ctx.font = '14px monospace';
                    ctx.fillText(`🎁상품까지 ${265 - finalScore}점 남았습니다!`, 200, 260);
                }
                
                descEl.innerText = '스페이스바를 눌러 재시작';
            }
        }

        gameLoop(0);
    </script>
</body>
</html>
